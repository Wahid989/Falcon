# Offline runtime MVP. Image construction may download pinned dependencies.
# Storage is optional: docker compose --profile storage up --build.
x-agent: &agent
  build:
    context: .
    dockerfile: src/agents/Dockerfile
  image: falcon-agent
  volumes:
    - ${FALCON_LOG_ROOT:-./logs}:/logs
  environment: &agent-env
    FALCON_LOG_DIR: /logs
    FALCON_SESSION_ID: ${FALCON_SESSION_ID:-manual-mvp}
  networks:
    - falcon

x-follower: &follower
  <<: *agent
  environment:
    <<: *agent-env
    FALCON_PRETTY_OUTPUT: "1"
  command: ["python", "-m", "src.agents.follower_runner", "--host", "0.0.0.0", "--port", "5000", "--agent-id", "follower-1", "--decision-engine", "src.decision.engine:decide", "--state", "config/mvp/moving.yml"]

services:
  commander:
    <<: *agent
    command: ["python", "-m", "src.agents.commander_runner", "--timeout", "5", "--connect-timeout", "2", "--connect-retries", "5"]
    environment:
      <<: *agent-env
      FALCON_FOLLOWERS: ${FALCON_FOLLOWERS:-follower-1=follower:5000}
      FALCON_PRETTY_OUTPUT: "1"
    depends_on:
      follower:
        condition: service_started

  follower:
    <<: *follower

  follower-2:
    <<: *follower
    profiles: [broadcast]
    command: ["python", "-m", "src.agents.follower_runner", "--host", "0.0.0.0", "--port", "5000", "--agent-id", "follower-2", "--decision-engine", "src.decision.engine:decide", "--state", "config/mvp/moving.yml"]

  follower-3:
    <<: *follower
    profiles: [broadcast]
    command: ["python", "-m", "src.agents.follower_runner", "--host", "0.0.0.0", "--port", "5000", "--agent-id", "follower-3", "--decision-engine", "src.decision.engine:decide", "--state", "config/mvp/moving.yml"]

  follower-low:
    <<: *follower
    profiles: [decline]
    command: ["python", "-m", "src.agents.follower_runner", "--host", "0.0.0.0", "--port", "5000", "--agent-id", "follower-low", "--decision-engine", "src.decision.engine:decide", "--state", "config/mvp/low-battery.yml"]

  storage-api:
    profiles: [storage]
    build:
      # The storage/ context lets the image include the SQL init scripts.
      context: ./storage
      dockerfile: dotnet/Dockerfile
    image: falcon-storage-api
    environment:
      # Connection string to SQL Server. Override in a git-ignored .env file
      # (see config/.env.example); never commit real credentials.
      ConnectionStrings__FalconDb: "${ConnectionStrings__FalconDb:-Server=sql-server,1433;Database=Falcon;User Id=sa;Password=Falcon_local_dev_1;TrustServerCertificate=True}"
    volumes:
      # JSONL exchange logs written by the agents. The service only reads them.
      - ${FALCON_LOG_ROOT:-./logs}:/logs:ro
    depends_on:
      sql-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - storage
    restart: unless-stopped

  sql-server:
    profiles: [storage]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Local development default. Override in a git-ignored .env file; never
      # commit real credentials.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Falcon_local_dev_1}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      # Init and test scripts, at the same path scripts/init-db.sh resolves to
      # when it is piped into the container.
      - ./storage/sql:/storage/sql:ro
    networks:
      - storage
    restart: unless-stopped
    healthcheck:
      # Reports healthy once SQL Server accepts connections, so storage-api
      # waits for a live database before starting.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  falcon:
    driver: bridge
    internal: true

  storage:
    driver: bridge
