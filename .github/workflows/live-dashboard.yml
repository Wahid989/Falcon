name: Live dashboard

# Publishes a status page to GitHub Pages on every merge to main.
# Today it shows build/test/coverage status; later it also renders scenario
# run output once FALCON-066/084 produce it (see scripts/build_dashboard.py).

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Adjusted for FALCON: pinned dev deps + coverage ---
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      # Tests must NOT fail the page build — we want the page published even when
      # a test is red (the page will show it as red). Hence the `|| true`.
      # `python -m pytest` puts the repo root on sys.path so tests import src.*.
      - name: Run tests
        run: |
          python -m pytest tests/ --cov=src --cov-report=xml \
            --junitxml=test-results.xml || true

      # OPTIONAL (enable once a scenario runner exists, ~FALCON-066/084):
      # produce a run log the dashboard can render, e.g.
      #   python -m falcon.harness --depth 3 --scenario scenarios/demo.yaml \
      #       --log-out run.jsonl || true

      - name: Build dashboard site/
        run: python scripts/build_dashboard.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
