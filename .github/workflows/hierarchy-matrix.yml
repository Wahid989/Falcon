name: Hierarchy acceptance

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  hierarchy-matrix:
    name: Hierarchy depth matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r requirements.txt coverage==7.17.3
      - name: Verify depths 2, 3, 5 and 10
        if: github.event_name != 'schedule'
        run: timeout 60s python -m coverage run --source=src,scripts -m scripts.hierarchy_harness --depth 2 3 5 10
      - name: Verify nightly depth 10 with 20 followers
        if: github.event_name == 'schedule'
        run: timeout 60s python -m coverage run --source=src,scripts -m scripts.hierarchy_harness --depth 10 --followers 20
      - name: Generate coverage report
        if: always()
        run: python -m coverage xml -o hierarchy-coverage.xml
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-coverage
          path: hierarchy-coverage.xml
