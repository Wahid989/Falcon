name: CI

# Runs on every push to any branch and on every pull request, so status is
# reported on commits and on PRs. To make a failing check block merges into
# main, enable branch protection on main and mark these jobs as required
# status checks (see docs/ci.md).
on:
  push:
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Project dependencies are pinned in requirements.txt once they exist
          # (added in the Python scaffolding ticket). Install them when present.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Ensure the lint/test tooling is always available, even before the
          # requirements files land.
          pip install pytest black flake8

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: timeout 30s python -m pytest tests/ -v

  windows-transport:
    name: Windows transport regression tests
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run socket and graceful-shutdown regressions
        run: python -m pytest tests/integration/test_tcp_transport.py tests/integration/test_agent_tcp_sessions.py::test_clean_follower_shutdown_while_idle -v

  mvp:
    name: Docker MVP checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Compose round trip, broadcast, decline and logs
        run: python -m scripts.run_mvp
      - name: Preserve MVP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-evidence
          path: logs/mvp/
          retention-days: 7

  dotnet:
    name: .NET (build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Detect .NET project
        id: detect
        run: |
          if find storage/dotnet -name '*.csproj' -o -name '*.sln' 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project found yet; skipping restore/build."
          fi

      - name: Restore dependencies
        if: steps.detect.outputs.exists == 'true'
        run: dotnet restore storage/dotnet

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: dotnet build storage/dotnet --no-restore --configuration Release

  storage-integration:
    name: Storage integration (agents + SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: falcon-storage-ci
      FALCON_LOG_ROOT: ${{ github.workspace }}/logs/storage-ci
      FALCON_REQUIRE_DB: "1"
      FALCON_TEST_DB: "Server=localhost,1433;Database=FalconTest;User Id=sa;Password=Falcon_local_dev_1;TrustServerCertificate=True"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate fresh Commander and Follower exchange logs
        run: |
          mkdir -p "$FALCON_LOG_ROOT" storage-results
          python - <<'PY'
          import os
          import runpy
          from pathlib import Path
          exchange = runpy.run_path("tests/integration/test_exchange_log_content.py")
          exchange["run_exchange"](Path(os.environ["FALCON_LOG_ROOT"]), session_id="storage-ci")
          PY
      - name: Start SQL Server and ingestion API
        run: |
          docker compose --profile storage up -d --build --wait --wait-timeout 180 sql-server storage-api
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:8080/health
      - name: Verify SQL schema constraints and idempotent initialization
        run: bash scripts/test-db.sh
      - name: Run .NET tests with database tests required
        run: dotnet test storage/dotnet --configuration Release --logger "trx;LogFileName=storage.trx" --results-directory "$GITHUB_WORKSPACE/storage-results"
      - name: Compare fresh agent logs with stored rows and check re-ingestion
        run: |
          python -m scripts.verify_storage --logs "$FALCON_LOG_ROOT" > storage-results/first-ingestion.json
          python -m scripts.verify_storage --logs "$FALCON_LOG_ROOT" > storage-results/repeated-ingestion.json
      - name: Collect storage diagnostics
        if: always()
        run: docker compose --profile storage logs --no-color > storage-results/compose.log 2>&1
      - name: Preserve storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-integration-evidence
          path: |
            storage-results/
            logs/storage-ci/
          retention-days: 7
      - name: Stop isolated storage stack
        if: always()
        run: docker compose --profile storage down --volumes --remove-orphans
