<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLIM FALCON — Live Status</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#111;--muted:#5f6368;--line:#e2e5ea;
        --green:#188038;--red:#d93025;--amber:#f9ab00;--blue:#1a73e8;}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--ink:#e8eaed;
        --muted:#9aa0a6;--line:#2a2e37;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:860px;margin:0 auto;padding:32px 16px 64px;}
  h1{font-size:22px;margin:0 0 2px;} .sub{color:var(--muted);margin:0 0 24px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px;}
  .big{font-size:26px;font-weight:650;margin:0;}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;}
  .ok{background:rgba(24,128,56,.14);color:var(--green);}
  .bad{background:rgba(217,48,37,.14);color:var(--red);}
  .na{background:rgba(95,99,104,.14);color:var(--muted);}
  .foot{color:var(--muted);font-size:13px;margin-top:28px;}
  code{background:rgba(127,127,127,.14);padding:1px 6px;border-radius:5px;font-size:13px;}
  a{color:var(--blue);}
</style>
</head>
<body>
<div class="wrap">
  <h1>SLIM FALCON — Live Status</h1>
  <p class="sub">Auto-published on every merge to <code>main</code>. Team 500-RF-1.</p>

  <div class="grid" id="cards">
    <div class="card"><p class="label">Loading…</p><p class="big">—</p></div>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
// Renders from data/summary.json written by scripts/build_dashboard.py.
// No framework, no network beyond this same-origin file.
(async () => {
  const cards = document.getElementById('cards');
  const foot  = document.getElementById('foot');
  let s;
  try { s = await (await fetch('data/summary.json?' + Date.now())).json(); }
  catch (e) { cards.innerHTML = card('Status','<span class="pill bad">no data</span>'); return; }

  const pill = (txt, cls) => `<span class="pill ${cls}">${txt}</span>`;
  const out = [];

  // Build / tests
  if (s.tests) {
    const t = s.tests;
    out.push(card('Tests',
      `<p class="big">${t.passed}/${t.total}</p>` +
      (t.green ? pill('passing','ok') : pill(t.failed + ' failing','bad')) +
      (t.skipped ? ` <span class="pill na">${t.skipped} skipped</span>` : '')));
  } else {
    out.push(card('Tests', pill('no report','na')));
  }

  // Coverage
  out.push(card('Coverage', s.coverage_pct != null
      ? `<p class="big">${s.coverage_pct}%</p>` : pill('n/a','na')));

  // Scenario run (fills in once FALCON-066/084 produce run.jsonl)
  out.push(card('Scenario run', s.run_exchanges != null
      ? `<p class="big">${s.run_exchanges}</p><span class="pill ok">exchanges logged</span>`
      : pill('not available yet','na')));

  cards.innerHTML = out.join('');

  const when = s.generated_at ? new Date(s.generated_at).toLocaleString() : '—';
  foot.innerHTML = `Last build ${when} · commit <code>${s.commit||'?'}</code> ` +
                   `${s.commit_msg ? '· ' + escapeHtml(s.commit_msg) : ''}`;
})();

function card(label, body){ return `<div class="card"><p class="label">${label}</p>${body}</div>`; }
function escapeHtml(x){ const d=document.createElement('div'); d.textContent=x; return d.innerHTML; }
</script>
</body>
</html>
